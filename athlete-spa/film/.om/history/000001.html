<script>
const V = OM.vars();
OM.music({ bpm: 144 });
const B = (n) => OM.beat(n);
const FPS = 60;
const sn = (t) => (Math.floor(t * FPS + 1e-6) + 0.5) / FPS;   // cuts half a frame in
const $ = (s) => document.querySelector(s);
const tl = gsap.timeline({ paused: true });

/* ---- variables into the DOM (words are split per letter) ---- */
document.documentElement.style.setProperty('--lime', V.lime);
document.documentElement.style.setProperty('--orange', V.orange);
document.documentElement.style.setProperty('--ink', V.ink);
document.documentElement.style.setProperty('--paper', V.paper);
function split(sel, text, periodColor) {
  const el = $(sel); el.innerHTML = '';
  [...text].forEach((c) => {
    const s = document.createElement('span'); s.className = 'ch'; s.textContent = c;
    if (c === '.' && periodColor) s.style.color = periodColor;
    el.appendChild(s);
  });
  return el.querySelectorAll('.ch');
}
const L1 = split('#w1', V.word1), L2 = split('#w2', V.word2), L3 = split('#w3', V.word3), L4 = split('#w4', V.word4, V.orange);
const LD1 = split('#wd1', V.line1a), LD2 = split('#wd2', V.line1b), LP1 = split('#wp1', V.line2a), LP2 = split('#wp2', V.line2b, V.orange);
$('#wm').textContent = V.wordmark; $('#so').textContent = V.signoff;
const wmEl = $('#wm'); wmEl.innerHTML = '<span style="color:var(--lime)">#</span>' + V.wordmark.replace(/^#/, '');
$('#n-streak1').textContent = V.streak;
// the marquee of the drop: the four words, repeated
$('#run').innerHTML = [V.word1, V.word2, V.word3, V.word4, V.word1, V.word2, V.word3, V.word4].map((w) => '<span>' + w.replace('.', '') + '</span><i>•</i>').join('');

/* ---- scenes on the beat grid ---- */
function scene(id, a, b) {
  tl.set(id, { opacity: 1 }, a === 0 ? 0 : sn(a));
  if (b) tl.set(id, { opacity: 0 }, sn(b));
}
scene('#s1', 0, B(4)); scene('#s2', B(4), B(8)); scene('#s3', B(8), B(12)); scene('#s4', B(12), B(16));
scene('#sb', B(16), B(22)); scene('#sst', B(22), B(24)); scene('#sd', B(24), B(28));
scene('#sp', B(28), B(32)); scene('#sm', B(32), 0);
tl.addLabel('scene:trenuj', 0).addLabel('scene:biegaj', B(4)).addLabel('scene:jedz', B(8)).addLabel('scene:wygrywaj', B(12))
  .addLabel('scene:burst', B(16)).addLabel('scene:stop', B(22)).addLabel('scene:drop', B(24))
  .addLabel('scene:payoff', B(28)).addLabel('scene:mark', B(32));

// the tag: on dark in lime/paper, on colour in ink
tl.set('#tag', { '--tc': '#0E0F11', '--th': '#0E0F11' }, sn(B(4)));
tl.set('#tag', { '--tc': '#F5F2EB', '--th': '#C3F037' }, sn(B(12)));
tl.set('#tag', { opacity: 0 }, sn(B(16)));

const pop = (sel, at) => tl.fromTo(sel, { scale: 0 }, { scale: 1, duration: 0.32, ease: 'back.out(2.2)' }, at);

/* S1 · TRENUJ.  — frame 0 is the poster: word, phone, sticker already there */
tl.fromTo('#w1', { scale: 1.05, transformOrigin: '50% 50%' }, { scale: 1, duration: 0.35, ease: 'expo.out' }, 0);
tl.fromTo('#ph1', { y: 120 }, { y: 0, duration: 0.55, ease: 'expo.out' }, 0);
tl.fromTo('#ph1', { scale: 1, rotation: -5, y: 0 }, { scale: 1.55, rotation: -2, y: 130, duration: 0.4, ease: 'expo.inOut', immediateRender: false }, B(2));
tl.fromTo('#stk1', { scale: 1 }, { scale: 1.14, duration: 0.18, ease: 'power2.out', yoyo: true, repeat: 1, immediateRender: false }, B(2));
tl.fromTo('#w1ghost', { opacity: 0 }, { opacity: 0.12, duration: 0.3, immediateRender: false }, 0);
OM.sfx('hit', 0.02, { gain: 0.8 }); OM.sfx('whoosh', B(2) - 0.15, { gain: 0.5 }); OM.sfx('pop', B(2) + 0.1, { gain: 0.5 });

/* S2 · BIEGAJ. — slides in from the right, orange ground */
let t0 = B(4);
tl.fromTo('#w2', { xPercent: 110 }, { xPercent: 0, duration: 0.4, ease: 'power4.out', immediateRender: false }, t0);
tl.fromTo('#ph2', { y: 700, rotation: 8 }, { y: 0, rotation: 4, duration: 0.5, ease: 'expo.out', immediateRender: false }, t0);
tl.fromTo('#ph2', { scale: 1 }, { scale: 1.4, y: 60, duration: 0.45, ease: 'expo.inOut', immediateRender: false }, B(6) - 0.05);
pop('#stk2', B(6) + 0.1);
OM.sfx('impact', t0 + 0.03, { gain: 0.6 }); OM.sfx('whoosh', t0 - 0.05, { gain: 0.35 }); OM.sfx('pop', B(6) + 0.2, { gain: 0.55 });

/* S3 · JEDZ. — letters drop in, lime ground */
t0 = B(8);
tl.fromTo(L3, { yPercent: -150 }, { yPercent: 0, duration: 0.32, stagger: 0.045, ease: 'power4.out', immediateRender: false }, t0);
tl.fromTo('#ph3', { y: 800, rotation: -8 }, { y: 0, rotation: -3, duration: 0.5, ease: 'expo.out', immediateRender: false }, t0 + 0.05);
tl.fromTo('#ph3', { scale: 1 }, { scale: 1.45, y: -40, duration: 0.45, ease: 'expo.inOut', immediateRender: false }, B(10) - 0.05);
pop('#stk3', B(10) + 0.1);
OM.sfx('impact', t0 + 0.03, { gain: 0.6 }); OM.sfx('pop', B(10) + 0.2, { gain: 0.55, note: 3 });

/* S4 · WYGRYWAJ. — letters grow from the baseline, black ground */
t0 = B(12);
tl.fromTo(L4, { scaleY: 0, transformOrigin: '50% 100%' }, { scaleY: 1, duration: 0.3, stagger: 0.03, ease: 'expo.out', immediateRender: false }, t0);
tl.fromTo('#ph4', { y: 800, rotation: 6 }, { y: 0, rotation: -4, duration: 0.5, ease: 'expo.out', immediateRender: false }, t0);
tl.fromTo('#ph4', { scale: 1 }, { scale: 1.3, y: 20, duration: 0.4, ease: 'expo.inOut', immediateRender: false }, B(14) - 0.05);
pop('#stk4a', B(14) + 0.05); pop('#stk4b', B(14) + 0.3);
OM.sfx('impact', t0 + 0.03, { gain: 0.6 }); OM.sfx('pop', B(14) + 0.15, { gain: 0.5, note: 5 }); OM.sfx('pop', B(14) + 0.4, { gain: 0.5, note: 8 });

/* BURST · full-bleed real screens, four on one beat, four on half a beat */
const SHOTS = [
  { img: 'history', fx: 585, fy: 850, z: 1.03, lb: '7 SESJI', bg: 'lime', fg: '#0E0F11', fs: 250, d: 1 },
  { img: 'log', fx: 585, fy: 1400, z: 1.05, lb: 'REGENERACJA', bg: 'ink', fg: 'lime', fs: 170, d: 1 },
  { img: 'running', fx: 585, fy: 1000, z: 1.05, lb: '8,2 KM', bg: 'orange', fg: '#0E0F11', fs: 250, d: 1 },
  { img: 'you', fx: 585, fy: 600, z: 1.08, lb: 'POZIOM 12', bg: 'lime', fg: '#0E0F11', fs: 230, d: 1 },
  { img: 'gamification', fx: 585, fy: 950, z: 1.05, lb: '4820 XP', bg: 'ink', fg: 'lime', fs: 250, d: 0.5 },
  { img: 'dashboard2', fx: 585, fy: 2050, z: 1.0, lb: '4654 KG', bg: 'orange', fg: '#0E0F11', fs: 250, d: 0.5 },
  { img: 'dashboard', fx: 585, fy: 400, z: 1.1, lb: '2/3 W TYGODNIU', bg: 'lime', fg: '#0E0F11', fs: 140, d: 0.5 },
  { img: 'you', fx: 585, fy: 1050, z: 1.08, lb: '14 DNI SERII', bg: 'ink', fg: 'orange', fs: 160, d: 0.5 },
];
const COL = { lime: V.lime, ink: V.ink, orange: V.orange };
const sb = $('#sb'); let bt = 16;
SHOTS.forEach((s, i) => {
  const el = document.createElement('div');
  el.style.cssText = 'position:absolute;inset:0;opacity:0;overflow:hidden;background:#0E0F11';
  el.dataset.omId = 'burst-' + (i + 1);
  const im = document.createElement('img'); im.className = 'bi'; im.src = 'assets/screens/' + s.img + '.png';
  const lb = document.createElement('div'); lb.className = 'd lb'; lb.textContent = s.lb; lb.style.cssText += `background:${COL[s.bg]};color:${COL[s.fg] || s.fg};font-size:${s.fs}px`;
  el.appendChild(im); el.appendChild(lb); sb.appendChild(el);
  const sc0 = 1080 / 1170 * s.z;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const x0 = clamp(540 - s.fx * sc0, 1080 - 1170 * sc0, 0), y0 = clamp(900 - s.fy * sc0, 1920 - 2532 * sc0, 0);
  const start = B(bt), dur = B(s.d);
  tl.set(el, { opacity: 1 }, sn(start)); tl.set(el, { opacity: 0 }, sn(start + dur));
  tl.fromTo(im, { scale: sc0 * 1.12, x: x0 - 40, y: y0 - 60 }, { scale: sc0, x: x0, y: y0, duration: dur, ease: 'power2.out', immediateRender: false }, start);
  tl.fromTo(lb, { yPercent: 100 }, { yPercent: 0, duration: Math.min(0.14, dur * 0.6), ease: 'power4.out', immediateRender: false }, start);
  OM.sfx('hit', start + 0.01, { gain: 0.55, pitch: 1 + i * 0.05 });
  bt += s.d;
});

/* STOP · a lone full stop; it becomes the flood on the downbeat */
tl.fromTo('#dot', { scale: 0.3 }, { scale: 1, duration: 0.12, ease: 'power4.out', immediateRender: false }, B(22));
tl.fromTo('#dot', { scale: 1 }, { scale: 24, duration: B(24) - 0.45 - B(22) + 0.45, ease: 'power4.in', immediateRender: false }, B(22) + 0.45 - 0.02 + 0.02);
OM.sfx('reverse', B(24), { gain: 0.6, dur: 0.8 });

/* DROP · lime flood, JEDNA APKA., the big phone, the tape */
t0 = B(24);
tl.fromTo(LD1, { scale: 1.5, opacity: 0, transformOrigin: '50% 60%' }, { scale: 1, opacity: 1, duration: 0.28, stagger: 0.02, ease: 'expo.out', immediateRender: false }, t0);
tl.fromTo(LD2, { scale: 1.5, opacity: 0, transformOrigin: '50% 60%' }, { scale: 1, opacity: 1, duration: 0.28, stagger: 0.02, ease: 'expo.out' }, t0 + B(1));
tl.fromTo('#phd', { y: 1000, rotation: -12 }, { y: 0, rotation: -5, duration: 0.6, ease: 'expo.out', immediateRender: false }, t0 + 0.1);
tl.fromTo('#run', { x: 0 }, { x: -760, duration: B(4), ease: 'none', immediateRender: false }, t0);
tl.fromTo('#tape', { xPercent: 60 }, { xPercent: 0, duration: 0.4, ease: 'power4.out', immediateRender: false }, t0 + B(2));
tl.fromTo('#dcam', { scale: 1 }, { scale: 1.07, duration: B(4), ease: 'none', immediateRender: false }, t0);
OM.sfx('whoosh', t0 + B(2) - 0.1, { gain: 0.4 }); OM.sfx('thud', t0 + 0.25, { gain: 0.6 });

/* PAYOFF · CAŁY / TRENING., the real tab bar rises */
t0 = B(28);
tl.fromTo(LP1, { yPercent: 130 }, { yPercent: 0, duration: 0.3, stagger: 0.03, ease: 'power4.out', immediateRender: false }, t0);
tl.fromTo(LP2, { yPercent: 130 }, { yPercent: 0, duration: 0.3, stagger: 0.03, ease: 'power4.out' }, B(30));
tl.fromTo('#tabs', { y: 600 }, { y: 0, duration: 0.5, ease: 'expo.out' }, B(30) + 0.3);
tl.fromTo('#disc', { y: 600 }, { y: 0, duration: 0.5, ease: 'expo.out' }, B(30) + 0.3);
tl.set('#disc', { opacity: 1 }, sn(B(30) + 0.3));
OM.sfx('impact', t0 + 0.03, { gain: 0.55 }); OM.sfx('thud', B(30) + 0.03, { gain: 0.55 }); OM.sfx('slide', B(30) + 0.3, { gain: 0.4 });

/* MARK · the + button grows into the app icon */
t0 = B(32);
// the disc sits exactly over the + of the tab bar (page x 535, y 1100 + 145), then grows to the centre
Object.assign($('#disc').style, { left: '404px', top: '1145px', width: '262px', height: '262px' });
tl.set('#disc', { opacity: 0 }, sn(t0 + 0.34));
tl.fromTo('#disc', { y: 0, scale: 1 }, { y: -430, scale: 1.8, duration: 0.34, ease: 'expo.inOut', immediateRender: false }, t0);
tl.fromTo('#logo', { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: 'expo.out' }, t0 + 0.12);
tl.fromTo('#wm', { yPercent: 40, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.35, ease: 'power4.out' }, t0 + 0.3);
tl.fromTo('#so', { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, B(34));
OM.sfx('whoosh', t0 - 0.05, { gain: 0.4 }); OM.sfx('chime', t0 + 0.25, { gain: 0.5 }); OM.sfx('pop', B(34) + 0.1, { gain: 0.45 });

/* ---- counters: computed from t alone (no history) ---- */
const eo = (p) => (p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));
const nf = (v, d) => v.toFixed(d).replace('.', ',');
OM.clock(tl, (t) => {
  $('#n-km').textContent = nf(8.2 * eo((t - (B(6) + 0.1)) / 0.45), 1);
  $('#n-kcal').textContent = String(Math.round(2600 - (2600 - 1240) * eo((t - (B(10) + 0.1)) / 0.45)));
  $('#n-streak2').textContent = String(Math.max(1, Math.round(1 + (V.streak - 1) * eo((t - (B(14) + 0.3)) / 0.5))));
}, B(36));
tl.to({}, { duration: 0.001 }, B(36) - 0.001);

window.__timelines = window.__timelines || {};
window.__timelines['film'] = tl;
</script>
