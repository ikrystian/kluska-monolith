<!doctype html><html><head><meta charset="utf-8"><title>B</title><link rel="stylesheet" href="common.css"><style>
#film{background:radial-gradient(1100px 900px at 60% 35%,#1b2210,#0E0F11 70%)}
.stage{position:absolute;left:0;top:0;width:1080px;height:1920px;perspective:1500px;perspective-origin:50% 45%}
.world{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;transform:translateY(-330px) rotateX(12deg) rotateY(-32deg) rotateZ(2deg)}
.l{position:absolute;left:-340px;width:680px;overflow:hidden;border-radius:34px;background-image:url(../materials/screens/dashboard.png);background-size:680px auto;background-repeat:no-repeat;box-shadow:0 50px 90px #000a}
/* dashboard.png is 1170 wide -> scale .5812 */
.l1{top:-760px;height:88px;background-position:0 0;transform:translateZ(260px);border-radius:20px}
.l2{top:-640px;height:170px;background-position:0 -87px;transform:translateZ(130px);background-color:#0E0F11}
.l3{top:-440px;height:218px;background-position:0 -290px;transform:translateZ(300px)}
.l4{top:-190px;height:480px;background-position:0 -540px;transform:translateZ(0px)}
.l5{top:320px;height:370px;background-position:0 -1100px;transform:translateZ(190px);background-image:url(../materials/screens/dashboard2.png)}
.title{position:absolute;left:60px;bottom:100px;font-size:158px;color:var(--ink);line-height:.84}
.title em{font-style:normal;color:var(--lime)}
.tag{position:absolute;left:60px;top:70px;font-size:54px;font-weight:800;color:var(--ink)}
.tag b{color:var(--lime)}
</style></head><body><div id="film" data-composition-id="film" data-width="1080" data-height="1920">
<div class="d tag"><b>#</b>LENIWAKLUSKA</div>
<div class="stage"><div class="world">
<div class="l l2"></div><div class="l l3"></div><div class="l l4"></div><div class="l l5"></div>
</div></div>
<div class="d title">Jedna apka.<br><em>Cały trening.</em></div>
</div></body></html>
