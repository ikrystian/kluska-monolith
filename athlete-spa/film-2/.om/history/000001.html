<!doctype html>
<html lang="pl" data-composition-variables='[
  {"id":"w1","type":"string","label":"Słowo 1","default":"TRENUJ."},
  {"id":"w2","type":"string","label":"Słowo 2","default":"BIEGAJ."},
  {"id":"w3","type":"string","label":"Słowo 3","default":"JEDZ."},
  {"id":"w4","type":"string","label":"Słowo 4","default":"WYGRYWAJ."},
  {"id":"hero1","type":"string","label":"Hero 1","default":"JEDNA APKA."},
  {"id":"hero2","type":"string","label":"Hero 2","default":"CAŁY TRENING."},
  {"id":"tag","type":"string","label":"Podpis","default":"Lightweight, baby!"},
  {"id":"lime","type":"color","label":"Limonka","default":"#C5F036"},
  {"id":"orange","type":"color","label":"Pomarańcz","default":"#FF5A1F"},
  {"id":"ink","type":"color","label":"Tło","default":"#0E1012"}
]'>
<head>
<meta charset="utf-8">
<title>Leniwa Kluska · Głębia</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/om.js"></script>
<style id="om-fonts">
@font-face { font-family: "Barlow Condensed"; src: url("assets/fonts/barlow-condensed-latin-ext-900-normal.woff2") format("woff2"); font-weight: 900; unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
@font-face { font-family: "Barlow Condensed"; src: url("assets/fonts/barlow-condensed-latin-900-normal.woff2") format("woff2"); font-weight: 900; unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
</style>
<style>
  :root { --lime:#C5F036; --orange:#FF5A1F; --ink:#0E1012; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background: var(--ink); }
  #film { position:relative; width:1080px; height:1920px; overflow:hidden; color:#F7F3EA; font-family:"Barlow Condensed", sans-serif;
    background: radial-gradient(1400px 1200px at 50% 38%, #1b1f24, var(--ink) 70%); }
  #world, #world * { transform-style: preserve-3d; }
  #world { position:absolute; left:0; top:0; width:1080px; height:1920px; }
  .phone { position:absolute; width:820px; height:1774px; }
  .shell { position:absolute; inset:-14px; border-radius:78px; background:#101215; box-shadow: 0 0 0 3px #2a2e35, 0 80px 140px -30px #000c; }
  .lay { position:absolute; background-repeat:no-repeat; border-radius:26px; box-shadow: 0 50px 90px -30px #000d, 0 0 0 2px #ffffff14; }
  .word { position:absolute; font-weight:900; text-transform:uppercase; line-height:.82; letter-spacing:-2px; white-space:nowrap; text-shadow: 0 30px 60px #0009; }
  .chip { position:absolute; padding:22px 34px 18px; border-radius:30px; font-weight:900; font-size:104px; line-height:.9; color:#0E1012; background:var(--lime); box-shadow: 0 40px 70px -20px #000b; white-space:nowrap; }
  .chip small { font-size:50px; letter-spacing:1px; margin-left:8px; }
  .chip.o { background:var(--orange); color:#fff; }
  .dot { position:absolute; width:14px; height:14px; border-radius:50%; background:var(--lime); }
  #floor { position:absolute; left:-6000px; top:2420px; width:16000px; height:9000px; transform: rotateX(90deg); transform-origin: 50% 0;
    background-image: linear-gradient(#C5F03622 2px, transparent 2px), linear-gradient(90deg, #C5F03622 2px, transparent 2px); background-size: 200px 200px; }
  #end { position:absolute; left:0; top:0; width:1080px; height:1920px; }
  #icon { position:absolute; left:340px; top:560px; width:400px; height:400px; border-radius:92px; box-shadow: 0 60px 100px -20px #000c; }
  #wm { position:absolute; left:0; width:1080px; top:1000px; text-align:center; font-weight:900; font-size:128px; letter-spacing:2px; line-height:1; }
  #wm i { color:var(--lime); font-style:normal; }
  #tg { position:absolute; left:0; width:1080px; top:1180px; text-align:center; font-weight:900; font-size:76px; color:var(--orange); letter-spacing:1px; }
</style>
</head>
<body>
<div id="film" data-composition-id="film" data-fps="30" data-width="1080" data-height="1920">
  <div id="world">
    <div id="floor"></div>
    <div id="dots"></div>
    <div id="stations"></div>
    <div class="phone" id="p0" data-om-id="phone-dashboard" style="left:130px;top:520px">
      <div class="shell"></div>
    </div>
    <div class="word" id="W1" data-om-id="word-1" data-var-text="w1" style="left:60px;top:20px;font-size:270px;color:var(--lime)">TRENUJ.</div>
    <div class="chip" id="C1" data-om-id="chip-streak" style="left:540px;top:1010px"><span>🔥</span> 14 <small>DNI SERII</small></div>
    <div class="chip o" id="C2" data-om-id="chip-kg" style="left:120px;top:1260px"><b id="kg">0</b><small>KG</small></div>
    <div class="word" id="W2" data-om-id="word-2" data-var-text="w2" style="font-size:250px;color:var(--lime)">BIEGAJ.</div>
    <div class="chip" id="C3" data-om-id="chip-km" style="font-size:120px"><b id="km">0,0</b><small>KM</small></div>
    <div class="word" id="W3" data-om-id="word-3" data-var-text="w3" style="font-size:250px;color:var(--orange)">JEDZ.</div>
    <div class="chip o" id="C4" data-om-id="chip-kcal" style="font-size:110px"><b id="kcal">0</b><small>KCAL ZOSTAŁO</small></div>
    <div class="word" id="W4" data-om-id="word-4" data-var-text="w4" style="font-size:230px;color:var(--lime)">WYGRYWAJ.</div>
    <div class="word" id="H1" data-om-id="hero-1" data-var-text="hero1" style="left:0;width:1080px;text-align:center;top:110px;font-size:222px;color:var(--lime)">JEDNA APKA.</div>
    <div class="word" id="H2" data-om-id="hero-2" data-var-text="hero2" style="left:0;width:1080px;text-align:center;top:330px;font-size:160px;color:#F7F3EA">CAŁY TRENING.</div>
    <div id="end">
      <img id="icon" data-om-id="icon" src="assets/icon.png" alt="">
      <div id="wm" data-om-id="wordmark"><i>#</i>LENIWAKLUSKA</div>
      <div id="tg" data-om-id="tagline" data-var-text="tag">Lightweight, baby!</div>
    </div>
  </div>
</div>

<script>
  const V = OM.vars();
  const BPM = 128, B = n => n * 60 / BPM;           // 1 beat = 0.46875 s, 32 beats = 15 s
  const S = 820 / 390;                              // phone CSS px -> film px
  const world = document.getElementById('world');
  const mk = (cls, html) => { const d = document.createElement('div'); d.className = cls; if (html) d.innerHTML = html; return d; };

  // ---- the dashboard, cut into layers (CSS-px rows of the real capture) ----
  const cut = (host, img, id, y0, y1, x0 = 0, x1 = 390) => {
    const d = mk('lay'); d.id = id; d.dataset.omId = id;
    d.style.cssText = `left:${x0*S}px;top:${y0*S}px;width:${(x1-x0)*S}px;height:${(y1-y0)*S}px;background-image:url(assets/screens/${img}.jpg);background-size:820px 1774px;background-position:${-x0*S}px ${-y0*S}px`;
    host.appendChild(d); return d;
  };
  const p0 = document.getElementById('p0');
  cut(p0, 'dashboard', 'L-header', 0, 56);
  cut(p0, 'dashboard', 'L-week', 56, 160);
  cut(p0, 'dashboard', 'L-push', 164, 300, 14, 378);
  cut(p0, 'dashboard', 'L-goals', 304, 590, 14, 378);
  cut(p0, 'dashboard', 'L-habits', 594, 748);
  cut(p0, 'dashboard', 'L-tab', 780, 844);

  // ---- the stations: full screens standing in depth along a route ----
  const ST = [
    { img: 'running',    x: 1450, z: -380, yaw: -20 },
    { img: 'dashboard2', x: 2750, z: -760, yaw: -22 },
    { img: 'log',        x: 4050, z: -1140, yaw: -20 },
    { img: 'history',    x: 5350, z: -1520, yaw: -22 },
    { img: 'you',        x: 6650, z: -1900, yaw: -20 },
  ];
  const stHost = document.getElementById('stations');
  ST.forEach((s, i) => {
    const d = mk('phone'); d.id = 'S' + i; d.dataset.omId = 'screen-' + s.img;
    d.style.cssText = `left:${s.x - 410 + 130 + 0}px;top:520px`;
    d.style.left = (s.x - 410) + 'px';
    const im = mk('lay'); im.style.cssText = `left:0;top:0;width:820px;height:1774px;background-image:url(assets/screens/${s.img}.jpg);background-size:820px 1774px;border-radius:64px;box-shadow:0 0 0 4px #2a2e35`;
    d.appendChild(im); stHost.appendChild(d);
    gsap.set(d, { z: s.z, rotationY: s.yaw });
  });

  // ---- space: drifting lime motes (seeded) ----
  const rnd = OM.random(7);
  const dh = document.getElementById('dots');
  for (let i = 0; i < 0; i++) {
    const d = mk('dot'); const sz = 6 + rnd() * 14;
    d.style.cssText = `width:${sz}px;height:${sz}px;background:rgba(197,240,54,${(0.25 + rnd()*0.5).toFixed(2)})`;
    dh.appendChild(d);
    gsap.set(d, { x: -500 + rnd() * 8200, y: -300 + rnd() * 2900, z: -2400 + rnd() * 2400 });
  }

  const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });
  const FL = { header: 560, week: 400, push: 300, goals: 180, habits: 70, tab: 470 };

  // layers fly apart in the first second and stay apart (the real dashboard, exploded)
  tl.addLabel('scene:hook', 0);
  [['L-header',FL.header,0,-130],['L-week',FL.week,70,-60],['L-push',FL.push,-30,0],['L-goals',FL.goals,40,60],['L-habits',FL.habits,-40,120],['L-tab',FL.tab,0,170]]
    .forEach(([id, z, x, y], i) => tl.fromTo('#' + id, { z: z + 260, x: x * 2.2 }, { z, x, y, duration: 1.5, ease: 'expo.out' }, i * 0.05));
  gsap.set('.shell', { z: -4 });

  // world slots for text and chips (all in front of / beside the layers)
  const place = (sel, x, y, z, ry = 0) => gsap.set(sel, { x, y, z, rotationY: ry });
  place('#W1', 0, 0, 640, 0); gsap.set('#W1', { top: 150 });
  place('#C1', 0, 0, 520, 0);
  place('#C2', 0, 0, 420, 0);
  // station words/chips: positioned over each station card's upper area, pushed forward in z
  const stw = (i, wsel, csel, wy, cy) => {
    const s = ST[i];
    gsap.set(wsel, { left: s.x - 400, top: wy, z: s.z + 360, rotationY: s.yaw });
    gsap.set(csel, { left: s.x - 280, top: cy, z: s.z + 520, rotationY: s.yaw });
  };
  stw(0, '#W2', '#C3', 330, 1500);
  stw(1, '#W3', '#C4', 330, 1500);
  gsap.set('#W4', { left: ST[2].x - 400, top: 330, z: ST[2].z + 360, rotationY: ST[2].yaw });
  gsap.set('#H1, #H2, #end', { opacity: 0 });

  // ---- one camera through one world ----
  const cam = OM.space('#world', { fov: 38 });
  cam.set({ target: [540, 960, 250], distance: 1900, yaw: -42, pitch: 12, roll: -6 });
  cam.to(tl, 0, { target: [540, 1000, 200], distance: 3000, yaw: -14, pitch: 10, roll: 0, duration: B(4), ease: 'expo.out' });
  cam.to(tl, B(4), { target: '#L-push', distance: 1150, yaw: 14, pitch: 6, roll: 2, duration: B(2), ease: 'expo.inOut' });
  cam.to(tl, B(6), { target: [540, 1250, 180], distance: 1700, yaw: -22, pitch: 4, roll: -1, duration: B(2), ease: 'sine.inOut' });
  // whip to the running screen
  cam.to(tl, B(8), { target: [1450, 1200, -380], distance: 3300, yaw: 12, pitch: 8, roll: 0, duration: B(1.5), ease: 'expo.inOut' });
  cam.to(tl, B(9.5), { target: [1450, 1180, -380], distance: 3000, yaw: -10, pitch: 6, duration: B(2.5), ease: 'sine.inOut' });
  // snap to the food screen
  cam.to(tl, B(12), { target: [2750, 1180, -760], distance: 3000, yaw: 14, pitch: 8, duration: B(1), ease: 'expo.inOut' });
  cam.to(tl, B(13), { yaw: -8, distance: 2800, duration: B(2), ease: 'sine.inOut' });
  // burst: three screens, 1.33 beats each
  cam.to(tl, B(15), { target: [4050, 1250, -1140], distance: 3100, yaw: 10, pitch: 6, duration: B(0.7), ease: 'expo.inOut' });
  cam.to(tl, B(16.33), { target: [5350, 1250, -1520], distance: 3100, yaw: -14, pitch: 4, duration: B(0.7), ease: 'expo.inOut' });
  cam.to(tl, B(17.66), { target: [6650, 1250, -1900], distance: 3000, yaw: 8, pitch: 6, duration: B(0.7), ease: 'expo.inOut' });
  // stop: crane back, the whole route
  cam.to(tl, B(19), { target: [2800, 1200, -800], distance: 5600, yaw: -58, pitch: 10, roll: 0, duration: B(2.5), ease: 'power2.inOut' });
  // drop: fly home, collapse flat
  cam.to(tl, B(22), { target: [540, 1010, 0], distance: 2788, yaw: 0, pitch: 0, roll: 0, flat: true, duration: B(2), ease: 'expo.inOut' });

  // ---- words, chips, numbers ----
  const slam = (sel, at, from = 1.5) => tl.fromTo(sel, { opacity: 0, scale: from }, { opacity: 1, scale: 1, duration: 0.34, ease: 'expo.out' }, at);
  const gone = (sel, at) => tl.to(sel, { opacity: 0, duration: 0.18, ease: 'power2.in' }, at);
  gsap.set('#W1,#C1,#C2,#W2,#C3,#W3,#C4,#W4', { opacity: 0 });

  slam('#W1', 0.02, 1.6);                                 // frame 0 poster word is on its way in
  tl.set('#W1', { opacity: 1 }, 0);                       // poster: the word is already there
  tl.fromTo('#W1', { scale: 1.35 }, { scale: 1, duration: 0.5, ease: 'expo.out' }, 0);
  slam('#C1', B(5), 0.4);
  slam('#C2', B(6), 0.4);
  const kg = { v: 0 }, km = { v: 0 }, kc = { v: 2600 };
  tl.to(kg, { v: 4654, duration: B(2), ease: 'power2.out', onUpdate: () => { document.getElementById('kg').textContent = Math.round(kg.v); } }, B(5.5));
  gone('#W1', B(8)); gone('#C1', B(8)); gone('#C2', B(8));

  slam('#W2', B(9.5), 1.5);
  slam('#C3', B(10), 0.5);
  tl.to(km, { v: 8.2, duration: B(1.5), ease: 'power2.out', onUpdate: () => { document.getElementById('km').textContent = km.v.toFixed(1).replace('.', ','); } }, B(10));
  gone('#W2', B(11.9)); gone('#C3', B(11.9));
  slam('#W3', B(12.2), 1.5);
  slam('#C4', B(12.6), 0.5);
  tl.to(kc, { v: 1240, duration: B(1.6), ease: 'power2.out', onUpdate: () => { document.getElementById('kcal').textContent = Math.round(kc.v); } }, B(12.6));
  gone('#W3', B(14.9)); gone('#C4', B(14.9));
  slam('#W4', B(15.1), 1.5);
  gone('#W4', B(19.2));

  // stations appear as the camera whips toward them and leave as it flies home
  tl.fromTo('#stations > .phone', { opacity: 0 }, { opacity: 1, duration: 0.3 }, B(7.6));
  tl.to('#stations > .phone', { opacity: 0, duration: 0.5, ease: 'power2.in' }, B(23));
  // drop: everything collapses, hero type slams
  tl.addLabel('scene:drop', B(22));
  tl.to('#L-header', { z: 0, x: 0, y: 0, duration: B(2), ease: 'expo.inOut' }, B(22))
    .to('#L-week', { z: 0, x: 0, y: 0, duration: B(2), ease: 'expo.inOut' }, B(22.1))
    .to('#L-push', { z: 0, x: 0, y: 0, duration: B(2), ease: 'expo.inOut' }, B(22.2))
    .to('#L-goals', { z: 0, x: 0, y: 0, duration: B(2), ease: 'expo.inOut' }, B(22.3))
    .to('#L-habits', { z: 0, x: 0, y: 0, duration: B(2), ease: 'expo.inOut' }, B(22.4))
    .to('#L-tab', { z: 0, x: 0, y: 0, duration: B(2), ease: 'expo.inOut' }, B(22.5));
  place('#H1', 0, 0, 0); place('#H2', 0, 0, 0);
  tl.fromTo('#H1', { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'expo.out' }, B(24));
  tl.fromTo('#H2', { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'expo.out' }, B(26));

  // mark: phone sinks, the icon takes the centre
  tl.addLabel('scene:end', B(28));
  tl.to('#p0', { y: 1500, duration: B(1.6), ease: 'expo.in' }, B(28))
    .to('#H1, #H2', { opacity: 0, y: -200, duration: B(1), ease: 'power2.in' }, B(28));
  tl.fromTo('#end', { opacity: 0 }, { opacity: 1, duration: 0.01 }, B(28.9));
  tl.fromTo('#icon', { scale: 0, rotation: -12 }, { scale: 1, rotation: 0, duration: 0.7, ease: OM.spring(0.3) }, B(28.9))
    .fromTo('#wm', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5 }, B(29.7))
    .fromTo('#tg', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5 }, B(30.5));
  tl.to({}, { duration: 0 }, B(32));

  // ---- sound ----
  OM.music({ bpm: BPM });
  OM.sfx('whoosh', 0, { gain: 0.8 });
  OM.sfx('hit', 0.02);
  [5, 6].forEach(n => OM.sfx('pop', B(n)));
  OM.sfx('whoosh', B(8)); OM.sfx('thud', B(9.5)); OM.sfx('pop', B(10));
  OM.sfx('whoosh', B(12)); OM.sfx('thud', B(12.2)); OM.sfx('pop', B(12.6));
  OM.sfx('thud', B(15.1)); [15, 16.33, 17.66].forEach(n => OM.sfx('hit', B(n)));
  OM.sfx('whoosh', B(19), { gain: 0.7 });
  OM.sfx('subdrop', B(24)); OM.sfx('hit', B(24)); OM.sfx('hit', B(26));
  OM.sfx('whoosh', B(28)); OM.sfx('pop', B(28.9)); OM.sfx('pop', B(30.5));

  window.__timelines['film'] = tl;
</script>
</body>
</html>
