services:
  mongo:
    image: mongo:8.0
    container_name: kluska-mongo
    restart: unless-stopped
    environment:
      GLIBC_TUNABLES: "glibc.pthread.rseq=1"
    ports:
      - "0.0.0.0:27018:27017"
    volumes:
      - mongo-data:/data/db

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: kluska-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI: http://localhost:8025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_MAX_MESSAGES: 5000
    volumes:
      - mailpit-data:/data
    command: ["--database", "/data/mailpit.db"]

volumes:
  mongo-data:
  mailpit-data:

