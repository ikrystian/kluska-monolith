<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { W, H, makeRenderer, rubberFloorTexture, makePlate, makeBar, makeCollarClamp, finish } from './common.js';

const params = new URLSearchParams(location.search);
const variant = params.get('v') || 'hero';

const { renderer, scene } = makeRenderer({ exposure: 1.05, bg: 0x0d0a08 });
scene.fog = new THREE.Fog(0x0d0a08, 2.2, 6.5);

// floor
const floorTex = rubberFloorTexture(2048, ['#26231f','#302c27','#3d3832'], '#0f0d0b');
floorTex.repeat.set(6, 6);
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(14, 14),
  new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.92, metalness: 0 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// barbell loaded to 140 kg: 20 bar + 2 × (25 + 20 + 15)
const bar = makeBar();
bar.position.y = 0.225;
scene.add(bar);
const load = [25, 20, 15];
for (const s of [1, -1]) {
  let x = 1.31 / 2 + 0.03 + 0.004;
  for (const kg of load) {
    const p = makePlate(kg);
    const t = p.userData.thickness;
    p.rotation.z = -Math.PI / 2 * s;
    p.position.set(s * (x + t / 2), 0.225, 0);
    // plates rest on the floor, smaller ones hang slightly lower on the sleeve
    const R = { 25: 0.225, 20: 0.225, 15: 0.2 }[kg];
    p.position.y = 0.225 - (0.225 - R) * 0.0 ;
    p.rotateY(s > 0 ? Math.PI * 0.62 : -Math.PI * 0.3);
    bar.parent.add(p);
    x += t + 0.001;
  }
  const clamp = makeCollarClamp();
  clamp.rotation.z = Math.PI / 2;
  clamp.position.set(s * (x + 0.018), 0.225, 0);
  scene.add(clamp);
}
// tilt the whole set a touch so it isn't a CAD drawing
// chalk smudge near the bar
const chalk = document.createElement('canvas');
chalk.width = chalk.height = 512;
const cg = chalk.getContext('2d');
for (let i = 0; i < 900; i++) {
  const r = Math.random() * 60;
  const a = Math.random() * Math.PI * 2;
  cg.fillStyle = `rgba(240,236,228,${Math.random() * 0.05})`;
  cg.beginPath();
  cg.arc(256 + Math.cos(a) * r * 2.6, 256 + Math.sin(a) * r, 6 + Math.random() * 22, 0, Math.PI * 2);
  cg.fill();
}
const chalkTex = new THREE.CanvasTexture(chalk);
chalkTex.colorSpace = THREE.SRGBColorSpace;
const chalkMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 1.4), new THREE.MeshStandardMaterial({ map: chalkTex, transparent: true, depthWrite: false, roughness: 1 }));
chalkMesh.rotation.x = -Math.PI / 2;
chalkMesh.position.set(0.35, 0.002, 0.35);
// chalk omitted

// lights
const key = new THREE.SpotLight(0xfff8f0, 55, 0, Math.PI / 7, 0.75, 1.6);
key.position.set(-0.6, 3.4, 1.4);
key.target.position.set(0.6, 0.1, 0);
key.castShadow = true;
key.shadow.mapSize.set(4096, 4096);
key.shadow.bias = -0.0002;
key.shadow.radius = 6;
scene.add(key, key.target);

const rim = new THREE.SpotLight(0xff7a3d, 26, 0, Math.PI / 9, 0.9, 1.4);
rim.position.set(1.2, 1.1, -2.4);
rim.target.position.set(0.8, 0.2, 0);
scene.add(rim, rim.target);

const fill = new THREE.PointLight(0x9fb4ff, 0.6, 0, 2);
fill.position.set(2.5, 0.8, 2.5);
scene.add(fill);

// camera
const cam = new THREE.PerspectiveCamera(variant === 'hero' ? 26 : 32, W / H, 0.01, 50);
if (variant === 'hero') {
  cam.position.set(1.62, 0.27, 1.05);
  cam.lookAt(0.42, 0.22, -0.05);
} else {
  // og / square crop: closer on the plate stack
  cam.position.set(1.55, 0.42, 0.95);
  cam.lookAt(0.8, 0.21, 0);
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, cam));
const focusDist = cam.position.distanceTo(new THREE.Vector3(0.8, 0.22, 0.05));
composer.addPass(new BokehPass(scene, cam, { focus: focusDist, aperture: 0.006, maxblur: 0.012 }));
composer.addPass(new OutputPass());
composer.render();
finish();
</script>
</body></html>
